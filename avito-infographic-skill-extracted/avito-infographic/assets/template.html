<meta charset="utf-8">
<title>Avito ИИ-агенты — комплект инфографик</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900&display=swap');

:root{
  --bg-0:#0a0410; --bg-1:#1a0533; --bg-2:#3b0a6e;
  --neon:#c084fc; --neon-2:#e879f9; --neon-3:#a855f7;
  --ink:#15101f; --white:#ffffff;
  --muted:rgba(255,255,255,.82);
  --gold:#f5b301; --green:#16a34a;
  --font:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070309;font-family:var(--font);-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px}
.stage{width:100%;max-width:1280px}
.cap{color:#8b7fb0;font:600 13px var(--font);letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px 2px}

/* ---- slide canvas ---- */
.slide{
  position:relative;width:1280px;height:960px;overflow:hidden;color:var(--white);
  background:
    radial-gradient(120% 95% at 82% -8%, var(--bg-2) 0%, rgba(59,10,110,0) 46%),
    radial-gradient(90% 80% at 10% 110%, #2a0a52 0%, rgba(42,10,82,0) 55%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-0) 70%);
  transform-origin:top left;
}
body.render .stage{height:auto!important}
body.render .slide{transform:none!important}

/* code haze + grain */
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 60% at 85% 25%, rgba(192,132,252,.10), transparent 70%);}
.codehaze{position:absolute;right:-2%;top:0;width:46%;height:100%;opacity:.10;
  font:700 22px/1.7 'Courier New',monospace;color:var(--neon-2);
  white-space:pre;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 40%);}

/* stars */
.star{position:absolute;color:var(--neon);filter:drop-shadow(0 0 8px rgba(192,132,252,.9))}

.pad{position:absolute;inset:0;padding:78px 84px;display:flex;flex-direction:column}

/* pills */
.pills{display:flex;gap:16px;margin-bottom:46px}
.pill{border:1.6px solid rgba(255,255,255,.5);border-radius:999px;padding:13px 28px;
  font:700 25px var(--font);letter-spacing:.01em}

/* headline */
.h1{font:800 96px/.97 var(--font);letter-spacing:-.025em;max-width:840px}
.h1 .key{position:relative;display:inline-block;padding:0 6px;
  background:linear-gradient(92deg,var(--neon),var(--neon-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(216,121,249,.55))}
.keywrap{position:relative;display:inline-block}
.keywrap .box{position:absolute;inset:-6px -2px;border:2px dashed rgba(255,255,255,.55);border-radius:4px}
.keywrap .hd{position:absolute;width:13px;height:13px;background:var(--neon-2);border:2px solid #fff;border-radius:3px}
.keywrap .tl{left:-9px;top:-13px}.keywrap .tr{right:-9px;top:-13px}
.keywrap .bl{left:-9px;bottom:-13px}.keywrap .br{right:-9px;bottom:-13px}

.sub{margin-top:42px;font:800 50px/1.06 var(--font);max-width:560px}
.sub .em{color:var(--neon-2)}

/* trust cards */
.cards{display:flex;flex-direction:column;gap:18px;align-items:flex-start;margin-top:40px;position:relative;z-index:4}
.card{display:flex;gap:18px;align-items:center;background:linear-gradient(180deg,#fff,#eceaf2);
  color:var(--ink);border-radius:22px;padding:20px 30px;font:900 30px var(--font);
  box-shadow:0 22px 48px rgba(0,0,0,.5);max-width:430px}
.badge{flex:0 0 auto;width:58px;height:58px;border-radius:16px;display:grid;place-items:center}
.badge.shield{background:linear-gradient(180deg,#22c55e,#15803d)}
.badge.stars{background:linear-gradient(180deg,#fde047,#f59e0b)}

/* mascot + face */
.mascot{position:absolute;right:96px;top:300px}
.keymasc{display:inline-block;vertical-align:-10px;margin-left:8px}
.face{position:absolute;right:30px;bottom:0;width:470px;height:912px;z-index:2;
  object-fit:cover;object-position:50% 0%;
  -webkit-mask-image:linear-gradient(180deg,#000 86%,transparent);
  mask-image:linear-gradient(180deg,#000 86%,transparent);
  filter:drop-shadow(-24px 8px 56px rgba(168,85,247,.4))}
.facebox{position:absolute;right:80px;bottom:0;width:448px;height:828px;z-index:2;
  border:2px dashed rgba(192,132,252,.55);border-bottom:none;border-radius:44px 44px 0 0;
  background:radial-gradient(58% 44% at 50% 32%, rgba(168,85,247,.30), rgba(168,85,247,.05));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;padding-bottom:70px}
.facebox .lbl{font:800 26px var(--font);color:#d6c7f5;letter-spacing:.03em;text-align:center;line-height:1.45}
.avatar{position:absolute;right:60px;top:54px;width:104px;height:104px;border-radius:50%;
  padding:4px;background:linear-gradient(180deg,var(--neon),var(--neon-3));
  box-shadow:0 12px 32px rgba(168,85,247,.55);z-index:6}
.avatar img,.avatar .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#241038}
.avatar img{object-position:50% 12%}
.avatar .ph{display:grid;place-items:center}

/* ===== CASE SLIDE ===== */
.case{display:grid;grid-template-columns:430px 1fr;gap:64px;align-items:center;height:100%}
.phone{width:392px;height:806px;border-radius:54px;background:#0b0b12;
  border:12px solid #1b1b25;box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 2px #2a2a38;padding:16px}
.screen{width:100%;height:100%;background:#f4f4f6;border-radius:42px;overflow:hidden;
  display:flex;flex-direction:column;color:#1f2430}
.statbar{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 6px;font:700 19px var(--font)}
.statbar .dots{letter-spacing:2px}
.chead{display:flex;align-items:center;gap:12px;padding:10px 22px 14px;border-bottom:1px solid #e4e4ea}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(180deg,#c084fc,#a855f7);display:grid;place-items:center}
.chead .nm{font:800 21px var(--font)}.chead .on{font:600 15px var(--font);color:#16a34a}
.chat{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.b{max-width:74%;padding:14px 18px;font:600 20px/1.25 var(--font);border-radius:20px}
.b.in{align-self:flex-start;background:#e9e9ef;color:#222;border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:linear-gradient(180deg,#a855f7,#8b3df0);color:#fff;border-bottom-right-radius:6px}
.opt{margin-top:6px;display:flex;flex-direction:column;gap:10px}
.opt button{padding:14px;border:none;border-radius:16px;background:#a78b6b;color:#fff;font:800 20px var(--font)}

.caseR{padding-right:30px}
.kicker{display:inline-block;font:700 24px var(--font);color:var(--neon-2);
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
.h2{font:900 70px/1.0 var(--font);letter-spacing:-.02em;margin-bottom:26px}
.body{font:600 30px/1.4 var(--muted);max-width:640px;margin-bottom:34px}
.res{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:36px}
.res .r{background:rgba(255,255,255,.06);border:1px solid rgba(192,132,252,.35);
  border-radius:18px;padding:20px 26px;min-width:170px}
.res .v{font:900 48px var(--font);color:var(--neon)}
.res .l{font:600 20px var(--font);color:var(--muted)}
.days{display:inline-block;background:linear-gradient(92deg,var(--neon-3),var(--neon-2));
  color:#fff;font:900 38px var(--font);padding:18px 34px;border-radius:18px;
  box-shadow:0 18px 40px rgba(168,85,247,.45)}

/* ===== INCLUDES ===== */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px}
.step{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  border-radius:22px;padding:30px 34px;display:flex;gap:24px;align-items:flex-start}
.step .n{flex:0 0 auto;width:66px;height:66px;border-radius:18px;display:grid;place-items:center;
  font:900 34px var(--font);background:linear-gradient(180deg,var(--neon),var(--neon-3));color:#fff}
.step .t{font:900 34px var(--font);margin-bottom:6px}
.step .d{font:600 23px/1.3 var(--muted)}

/* ===== STACK ===== */
.chips{display:flex;flex-wrap:wrap;gap:22px;margin-top:24px;max-width:1000px}
.chip{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.06);
  border:1.6px solid rgba(192,132,252,.4);border-radius:18px;padding:22px 34px;
  font:800 36px var(--font)}
.chip .dot{width:18px;height:18px;border-radius:6px;background:linear-gradient(180deg,var(--neon),var(--neon-3))}

/* ===== CTA ===== */
.cta{justify-content:center}
.cta .h1{font-size:104px;max-width:900px}
.cta .sub2{margin-top:30px;font:700 42px/1.2 var(--font);color:var(--muted);max-width:720px}
.promo{margin-top:50px;display:inline-flex;align-items:center;gap:18px;
  background:rgba(255,255,255,.06);border:2px dashed rgba(192,132,252,.6);
  border-radius:20px;padding:24px 36px;font:800 40px var(--font)}
.promo b{color:var(--neon-2)}
.note{margin-top:30px;font:600 26px var(--font);color:#9a8fc0}
.heart{position:absolute;right:60px;bottom:60px;filter:drop-shadow(0 0 40px rgba(168,85,247,.8))}
</style>

<div class="wrap" id="wrap"></div>

<script>
/* ---------- DEMO data (used when window.LISTING is not injected) ---------- */
const DEMO = {
  photo:null,                                          // "face.png" → подставит фото; null → плейсхолдер
  tagline:["Быстро","Качественно","Красиво"],
  headline:{pre:"Разработка и внедрение",key:"ИИ-агентов",post:""},
  subline:["Индивидуально под","ваш бизнес"],
  badges:[{type:"shield",text:"Вся работа под ключ"},{type:"stars",text:"200+ отзывов"}],
  cases:[{
    niche:"для химчистки",
    body:"Чат-бот принимает заявки через сайт и мессенджеры, ведёт клиента по сценарию и собирает отзывы с анализом тональности.",
    results:[{v:"70%",l:"заказов онлайн"},{v:"+18%",l:"средний чек"},{v:"+25%",l:"повторные"}],
    days:7,
    chat:[
      {side:"in",text:"Здравствуйте! Какую услугу хотите заказать?"},
      {side:"out",text:"Почистить куртку"},
      {side:"in",text:"Отлично! Какой тип ткани?"},
      {side:"out",text:"Шерсть"}
    ],
    options:["Химчистка","Традиционная"]
  }],
  includes:[
    {t:"Аудит",d:"разбираем процессы и точки потерь заявок"},
    {t:"Сценарии",d:"проектируем диалоги под вашу нишу"},
    {t:"Разработка",d:"собираем агента на нужном стеке"},
    {t:"Интеграция",d:"сайт, мессенджеры и ваша CRM"},
    {t:"Поддержка",d:"дорабатываем по реальным диалогам"},
    {t:"Аналитика",d:"отчёты по заявкам и конверсии"}
  ],
  stack:["Telegram","WhatsApp","Сайт","amoCRM","Битрикс24","Авито","Телефония"],
  cta:{headline:["Напишите","прямо сейчас"],sub:"Бесплатная консультация и расчёт под вашу нишу",
       promo:{code:"АВИТО",value:"15"}}
};

const D = (typeof window!=='undefined' && window.LISTING) ? window.LISTING : DEMO;

/* ---------- svg helpers ---------- */
const STAR='<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.6 6 5.4 11 11 11.4-5.6.6-10.4 5.4-11 11.4-.6-6-5.4-10.8-11-11.4C6.6 11 11.4 6 12 0z"/></svg>';
const SHIELD='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8-8 11-4.5-3-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg>';
const STARI='<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 16.9 6.2 20.3l1.6-6.6L2.6 8.8l6.8-.5L12 2z"/></svg>';
const MASCOT=`<svg width="190" height="220" viewBox="0 0 190 220" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#8b3df0"/></linearGradient></defs>
  <rect x="92" y="6" width="6" height="34" rx="3" fill="#c084fc"/><circle cx="95" cy="6" r="8" fill="#e879f9"/>
  <rect x="28" y="40" width="134" height="118" rx="34" fill="url(#mg)"/>
  <rect x="50" y="74" width="90" height="50" rx="22" fill="#1a0533"/>
  <circle cx="78" cy="99" r="11" fill="#fff"/><circle cx="112" cy="99" r="11" fill="#fff"/>
  <circle cx="80" cy="101" r="5" fill="#1a0533"/><circle cx="114" cy="101" r="5" fill="#1a0533"/>
  <path d="M78 138 q17 14 34 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="60" y="162" width="70" height="40" rx="16" fill="url(#mg)"/>
  <rect x="150" y="92" width="30" height="10" rx="5" fill="#e879f9" transform="rotate(28 165 97)"/>
</svg>`;
const HEART=`<svg width="300" height="280" viewBox="0 0 300 280"><defs><radialGradient id="hg" cx="50%" cy="40%"><stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#6d28d9"/></radialGradient></defs><path d="M150 252C60 196 10 150 10 92 10 50 44 20 84 20c28 0 52 16 66 42 14-26 38-42 66-42 40 0 74 30 74 72 0 58-50 104-140 160z" fill="none" stroke="url(#hg)" stroke-width="10"/></svg>`;
const SILH=(w,h)=>`<svg width="${w}" height="${h}" viewBox="0 0 220 260" fill="#b39ddb"><circle cx="110" cy="80" r="58"/><path d="M16 260c0-60 42-98 94-98s94 38 94 98z"/></svg>`;
const PH_LBL=`<div>${SILH(210,250)}</div><div class="lbl">ВАШЕ ФОТО<br><span style="font-weight:600;font-size:18px">PNG без фона, по&nbsp;плечи</span></div>`;

function faceBig(){
  if(D.photo) return `<img class="face" src="${D.photo}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="facebox" style="display:none">${PH_LBL}</div>`;
  return `<div class="facebox">${PH_LBL}</div>`;
}
function avatar(){
  if(D.photo) return `<div class="avatar"><img src="${D.photo}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="ph" style="display:none">${SILH(56,66)}</span></div>`;
  return `<div class="avatar"><span class="ph">${SILH(56,66)}</span></div>`;
}

function scatter(n){let s='';const seed=[[8,12],[40,6],[70,18],[14,55],[60,72],[88,40],[30,86],[78,90],[50,30]];
  for(let i=0;i<n;i++){const p=seed[i%seed.length];const sz=14+(i%3)*8;
    s+=`<span class="star" style="left:${p[0]}%;top:${p[1]}%;font-size:${sz}px;opacity:${.5+(i%3)*.18}">${STAR}</span>`;}
  return s;}

/* ---------- slide builders ---------- */
function offer(){
  const pills=D.tagline.map(t=>`<span class="pill">${t}</span>`).join('');
  const sub=(D.subline||[]).map((l,i)=>i===D.subline.length-1?`<span class="em">${l}</span>`:l).join('<br>');
  const cards=D.badges.map(b=>`<div class="card"><span class="badge ${b.type}">${b.type==='shield'?SHIELD:STARI}</span>${b.text}</div>`).join('');
  return `<div class="codehaze">if ctx == agent:\n  reply(lead)\n  to_crm()\n  notify()\nelse:\n  escalate()</div>
  ${scatter(7)}
  <div class="pad">
    <div class="pills">${pills}</div>
    <div class="h1" style="font-size:88px;max-width:660px">${D.headline.pre} <span class="keywrap"><span class="key">${D.headline.key}</span><span class="box"></span><i class="hd tl"></i><i class="hd tr"></i><i class="hd bl"></i><i class="hd br"></i></span><span class="keymasc">${MASCOT.replace('width="190" height="220"','width="68" height="80"')}</span> ${D.headline.post||''}</div>
    <div class="sub">${sub}</div>
    <div class="cards">${cards}</div>
  </div>
  ${faceBig()}`;
}

function caseSlide(c){
  const chat=c.chat.map(m=>`<div class="b ${m.side}">${m.text}</div>`).join('');
  const opts=(c.options||[]).map(o=>`<button>${o}</button>`).join('');
  const res=c.results.map(r=>`<div class="r"><div class="v">${r.v}</div><div class="l">${r.l}</div></div>`).join('');
  return `${scatter(5)}${avatar()}<div class="pad"><div class="case">
    <div class="phone"><div class="screen">
      <div class="statbar"><span>9:41</span><span class="dots">●●● ▮▮ ▮</span></div>
      <div class="chead"><span class="av">${MASCOT.replace('width="190" height="220"','width="26" height="30"')}</span>
        <div><div class="nm">Чат-бот ${c.niche}</div><div class="on">в сети</div></div></div>
      <div class="chat">${chat}<div class="opt">${opts}</div></div>
    </div></div>
    <div class="caseR">
      <span class="kicker">Кейс разработки</span>
      <div class="h2">ИИ-агент ${c.niche}</div>
      <div class="body">${c.body}</div>
      <div class="res">${res}</div>
      <div class="days">Разработано за ${c.days} дней</div>
    </div>
  </div></div>`;
}

function includes(){
  const items=D.includes.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><div><div class="t">${s.t}</div><div class="d">${s.d}</div></div></div>`).join('');
  return `${scatter(5)}${avatar()}<div class="pad">
    <div class="h1" style="font-size:74px;max-width:1000px">Всё <span class="keywrap"><span class="key">под ключ</span><span class="box"></span><i class="hd tl"></i><i class="hd tr"></i><i class="hd bl"></i><i class="hd br"></i></span></div>
    <div class="steps">${items}</div></div>`;
}

function stack(){
  const chips=D.stack.map(s=>`<div class="chip"><span class="dot"></span>${s}</div>`).join('');
  return `${scatter(6)}${avatar()}<div class="pad">
    <div class="h1" style="font-size:74px">Подключаем <span class="keywrap"><span class="key">куда угодно</span><span class="box"></span><i class="hd tl"></i><i class="hd tr"></i><i class="hd bl"></i><i class="hd br"></i></span></div>
    <div class="chips">${chips}</div>
    <div class="note" style="margin-top:50px">Сайт, мессенджеры, телефония и ваша CRM — в одном агенте</div></div>`;
}

function cta(){
  const head=(D.cta.headline||[]).join('<br>');
  return `${scatter(6)}${avatar()}<div class="pad cta">
    <div class="h1">${head}</div>
    <div class="sub2">${D.cta.sub}</div>
    ${D.cta.promo?`<div class="promo">Промокод <b>«${D.cta.promo.code}»</b> — скидка ${D.cta.promo.value}%</div>`:''}
    <div class="note">Пишите в чат Авито — ответим и рассчитаем</div>
    <div class="heart">${HEART}</div></div>`;
}

/* ---------- compose ---------- */
const slides=[['offer',offer()]];
D.cases.forEach((c,i)=>slides.push(['case_'+(i+1),caseSlide(c)]));
slides.push(['includes',includes()],['stack',stack()],['cta',cta()]);

const wrap=document.getElementById('wrap');
slides.forEach(([id,html])=>{
  const stage=document.createElement('div');stage.className='stage';
  stage.innerHTML=`<p class="cap">${id} · 1280×960</p><div class="slide" data-id="${id}">${html}</div>`;
  wrap.appendChild(stage);
});

/* responsive preview scaling (disabled in render mode) */
function fit(){
  if(document.body.classList.contains('render'))return;
  document.querySelectorAll('.stage').forEach(st=>{
    const sl=st.querySelector('.slide');const w=st.clientWidth;const s=Math.min(1,w/1280);
    sl.style.transform=`scale(${s})`;sl.style.marginBottom=(960*s-960)+'px';
  });
}
window.addEventListener('resize',fit);fit();
</script>
